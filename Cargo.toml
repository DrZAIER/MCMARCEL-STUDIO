[workspace]
resolver = "2"
members = [
    "crates/mcmarcel-core",
    "crates/mcmarcel-store",
    "crates/mcmarcel-server",
    "crates/mcmarcel-cli",
]
# The Tauri desktop shell is built separately (it pulls the whole webview stack),
# so it is excluded from the fast core workspace build and test cycle.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["McMarcel Studio contributors"]
repository = "https://github.com/chermid/mcmarcel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
blake3 = "1.5"
csv = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
